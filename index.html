<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <!-- 更新图标引用 -->
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="manifest" href="site.webmanifest">
    <link rel="mask-icon" href="safari-pinned-tab.svg" color="#ff3852">
    <meta name="theme-color" content="#ff3852">
    
    <!-- 添加样式表 -->
    <link rel="stylesheet" href="styles.css">
    <title>今日热搜榜</title>
</head>
<body>
<header>
    <div class="logo">
        <i class="icon">🔥</i>
        <h1>今日热搜榜</h1>
    </div>
    <p class="subtitle">AI实时解读热搜话题</p>
    <div class="actions">
        <button id="theme-toggle">切换主题</button>
    </div>
</header>
<main>
    <div class="container">
        <div class="left-panel">
            <div class="platform-tabs">
                <button class="platform-tab active" data-platform="networkhot">全网热搜</button>
                <button class="platform-tab" data-platform="toutiao">头条</button>
                <button class="platform-tab" data-platform="douyin">抖音</button>
            </div>
            <ul id="hot-news-list" class="hot-news-list">
                <!-- 热搜列表项将在这里生成 -->
            </ul>
        </div>
        
        <!-- PC端内容区域 -->
        <div id="content-area" class="content-area desktop-only">
            <div class="placeholder">
                <h2>选择一个热搜话题，查看AI解读</h2>
                <p>点击左侧列表中的热搜话题，AI将为您生成解读内容</p>
            </div>
        </div>
    </div>
</main>

<!-- 添加分享按钮区域 -->
<div class="share-container">
    <button class="share-btn copy-link" id="copy-link-btn">
        <i class="share-icon">🔗</i>
        <span>复制链接</span>
    </button>
    <button class="share-btn share-weibo" id="share-weibo-btn">
        <i class="share-icon">🔄</i>
        <span>分享到微博</span>
    </button>
    <button class="share-btn share-wechat" id="share-wechat-btn">
        <i class="share-icon">💬</i>
        <span>分享到微信</span>
    </button>
</div>

<!-- 确保PC端模板存在 -->
<template id="news-content-template">
    <div class="news-content">
        <!-- <h2 class="content-title"></h2> -->
        <div class="content-body">
            <div class="text-content"></div>
            <div class="image-container"></div>
            <div class="loading">
                <div class="loading-spinner"></div>
                <p>AI正在生成解读...</p>
            </div>
            <div class="ai-content">
                <div class="author-info">
                    <div class="author-avatar">AI</div>
                    <div class="author-meta">
                        <h3>AI热搜解读</h3>
                        <p>刚刚发布</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</template>

<!-- 添加脚本 -->
<script src="script.js"></script>

<!-- 添加内联脚本确保分享按钮功能正常 -->
<script>
    // 确保DOM加载完成后执行
    document.addEventListener('DOMContentLoaded', function() {
        // 复制链接按钮
        document.getElementById('copy-link-btn').addEventListener('click', function() {
            const url = window.location.href;
            navigator.clipboard.writeText(url)
                .then(() => {
                    showToastMessage('链接已复制到剪贴板');
                })
                .catch(err => {
                    console.error('复制失败:', err);
                    fallbackCopy(url);
                });
        });
        
        // 分享到微博按钮
        document.getElementById('share-weibo-btn').addEventListener('click', function() {
            const url = encodeURIComponent(window.location.href);
            const title = encodeURIComponent(document.title);
            const weiboUrl = `https://service.weibo.com/share/share.php?url=${url}&title=${title}`;
            window.open(weiboUrl, '_blank');
        });
        
        // 分享到微信按钮
        document.getElementById('share-wechat-btn').addEventListener('click', function() {
            showToastMessage('请使用微信扫一扫，扫描当前页面分享');
        });
        
        // 显示提示消息
        function showToastMessage(message) {
            const oldToast = document.querySelector('.toast-message');
            if (oldToast) oldToast.remove();
            
            const toast = document.createElement('div');
            toast.className = 'toast-message';
            toast.textContent = message;
            document.body.appendChild(toast);
            
            setTimeout(() => toast.classList.add('show'), 10);
            setTimeout(() => {
                toast.classList.remove('show');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }
        
        // 备用复制方法
        function fallbackCopy(text) {
            const textArea = document.createElement('textarea');
            textArea.value = text;
            textArea.style.position = 'fixed';
            textArea.style.left = '-9999px';
            document.body.appendChild(textArea);
            textArea.select();
            
            try {
                document.execCommand('copy');
                showToastMessage('链接已复制到剪贴板');
            } catch (err) {
                showToastMessage('复制失败，请手动复制');
            }
            
            document.body.removeChild(textArea);
        }
    });
</script>
</body>
</html>
