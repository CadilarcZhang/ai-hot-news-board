<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>今日热搜榜</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="alternate icon" href="/favicon.svg">
    <link rel="manifest" href="/site.webmanifest">
    <link rel="stylesheet" href="/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <div class="container">
        <header>
            <div class="logo">
                <i class="fas fa-fire-alt"></i>
                <h1>今日热搜榜</h1>
            </div>
            <p class="subtitle">选择一条热搜，AI将为您生成</p>
            <button id="theme-toggle" class="theme-toggle" aria-label="切换主题"></button>
        </header>
        
        <main>
            <div class="left-panel">
                <div class="platform-tabs">
                    <button class="platform-tab active" data-platform="networkhot">
                        <i class="fab fa-weibo"></i> 全网
                    </button>
                    <button class="platform-tab" data-platform="toutiao">
                        <span>头条</span>
                    </button>
                    <button class="platform-tab" data-platform="douyin">
                        <span>抖音</span>
                    </button>
                    <button class="refresh-btn">
                        <i class="fas fa-sync-alt"></i> 刷新
                    </button>
                </div>
                
                <div class="hot-list">
                    <ul id="hot-news-list">
                        <!-- 热搜列表将通过JavaScript动态生成 -->
                    </ul>
                </div>
            </div>
            
            <div class="right-panel">
                <div class="content-area" id="content-area">
                    <div class="placeholder">
                        <!-- <p>👈 请从左侧选择一条热搜</p> -->
                    </div>
                    <!-- 内容区域将动态生成 -->
                </div>
            </div>
        </main>
        
        <footer>
            <p>© 2025 今日热搜榜 - AI智能图文生成</p>
        </footer>
    </div>
    
    <!-- 内容模板 -->
    <template id="news-content-template">
        <div class="news-content" style="display: none;">
            <div class="author-info">
                <div class="avatar">
                    <span>AI</span>
                </div>
                <div class="author-meta">
                    <h3>作者</h3>
                    <p>刚刚发布·</p>
                </div>
            </div>
            
            <h2 class="content-title"></h2>
            
            <div class="loading">生成中...</div>
            
            <div class="ai-content" style="display: none;">
                <div class="text-content"></div>
                <div class="image-container"></div>
            </div>
            
            <div class="share-buttons">
                <button class="share-btn copy-link">
                    <i class="fas fa-link"></i> 复制链接
                </button>
                <button class="share-btn share-weibo">
                    <i class="fab fa-weibo"></i> 分享到微博
                </button>
                <button class="share-btn share-wechat">
                    <i class="fab fa-weixin"></i> 分享到微信
                </button>
            </div>
        </div>
    </template>
    
    <script src="/script.js"></script>
</body>
</html>
